  <script>
    (function normalizeLegacyHashRoute() {
      const hash = window.location.hash;
      if (hash.startsWith('#/')) {
        window.history.replaceState(null, document.title, hash.slice(1));
      }
    })();
  </script>
  <script>
    (async function loadSeoMeta() {
      const keywordsTag = document.querySelector('meta[name="keywords"]');
      if (!keywordsTag) return;

      const configuredApiBase = '%VITE_API_URL%';
      const apiBase = (configuredApiBase && !configuredApiBase.startsWith('%'))
        ? configuredApiBase.replace(/\/+$/, '')
        : 'http://localhost:5000/api';

      try {
        const response = await fetch(`${apiBase}/seo`);
        if (!response.ok) throw new Error('SEO API request failed');

        const data = await response.json();

        if (Array.isArray(data?.keywords)) {
          const keywords = data.keywords
            .map((item) => (typeof item === 'string' ? item : (item?.keyword || '')))
            .map((item) => String(item).trim())
            .filter(Boolean);

          if (keywords.length > 0) {
            keywordsTag.setAttribute('content', keywords.join(', '));
          }
        }
      } catch (error) {
        console.warn('SEO keywords could not be loaded from API:', error);
      }
    })();
  </script>
